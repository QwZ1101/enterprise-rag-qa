map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 证书续签用的挑战目录，所有域名共用一个 webroot。
server {
    listen 80;
    listen [::]:80;
    server_name qwzcode.com www.qwzcode.com rag.qwzcode.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# chatbi 暂时只走 HTTP：当前证书尚未覆盖 chatbi.qwzcode.com，
# 解析记录补齐、证书 expand 之后改走下面的 443 server 块。
server {
    listen 80;
    listen [::]:80;
    server_name chatbi.qwzcode.com;

    auth_basic "ChatBI Demo";
    auth_basic_user_file /etc/nginx/htpasswd/qz;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        auth_basic off;
    }

    location = /robots.txt {
        auth_basic off;
        root /var/www/qwzcode;
    }

    # Gradio 自带页面没有页脚，用 sub_filter 注入备案号以满足挂载要求。
    sub_filter_once on;
    sub_filter '</body>' '<div style="position:fixed;left:0;right:0;bottom:0;z-index:9999;padding:6px 12px;font:12px/1.5 sans-serif;color:#888;background:rgba(255,255,255,.85);text-align:center;">赣ICP备2026027711号-1 · <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">备案信息</a></div></body>';

    location / {
        proxy_pass http://127.0.0.1:7860;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 32m;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name qwzcode.com www.qwzcode.com;

    ssl_certificate /etc/letsencrypt/live/qwzcode.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qwzcode.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/qwzcode;
    index index.html;

    add_header Strict-Transport-Security "max-age=15552000" always;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rag.qwzcode.com;

    ssl_certificate /etc/letsencrypt/live/qwzcode.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qwzcode.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    auth_basic "RAG Demo";
    auth_basic_user_file /etc/nginx/htpasswd/qz;

    add_header Strict-Transport-Security "max-age=15552000" always;

    location = /robots.txt {
        auth_basic off;
        root /var/www/qwzcode;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 32m;
    }
}
